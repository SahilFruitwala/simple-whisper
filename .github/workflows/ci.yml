name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: |
          brew install xcodegen
          xcodebuild -downloadComponent MetalToolchain
      - name: Build (ad-hoc signed)
        run: make build SIGN_IDENTITY=-
